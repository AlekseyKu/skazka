services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-skazka_db}
      POSTGRES_USER: ${DB_USER:-skazka_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    env_file:
      - .env.example
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  mini-app:
    build:
      context: ./mini-app
    volumes:
      - ./mini-app:/app
      - miniapp_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    volumes:
      - ./:/app
    command: ["python", "main.py"]

volumes:
  postgres_data:
  miniapp_node_modules:
